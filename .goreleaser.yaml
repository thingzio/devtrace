version: 2

# Image building lives in .github/workflows/release-on-tag.yaml, which calls the
# shared thingzio/actions build-ko workflow. goreleaser here builds binaries,
# archives, and checksums only -- it no longer pushes containers.

project_name: devtrace

builds:
  - id: devtrace-site
    binary: devtrace-site
    dir: ./cmd/devtrace-site
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
        -X main.version={{.Version}}
        -X main.commit={{.ShortCommit}}
        -X main.date={{.CommitDate}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64


release:
  github:
    owner: thingzio
    name: devtrace
  prerelease: auto
  draft: true

report_sizes: true

snapshot:
  version_template: "{{.Tag}}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^build:"
      - "^ci:"
      - "^style:"
      - typo
      - readme
