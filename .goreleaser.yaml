version: 2

# Image building lives in .github/workflows/release-on-tag.yaml, which calls the
# shared thingzio/actions build-ko workflow. goreleaser here builds binaries,
# archives, and checksums only -- it no longer pushes containers.
#
# goreleaser is invoked by the shared release-go workflow, not by this
# repository, and its version is pinned there in .versions.yaml. Signing is
# deliberately absent: release-go signs the checksum file in a separate job
# that runs none of this configuration, and passes --skip=sign here. A signs
# block would be a signature nobody produces.

project_name: devtrace

builds:
  - id: devtrace-site
    binary: devtrace-site
    dir: ./cmd/devtrace-site
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
        -X main.version={{.Version}}
        -X main.commit={{.ShortCommit}}
        -X main.date={{.CommitDate}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64


release:
  github:
    owner: thingzio
    name: devtrace
  prerelease: auto
  # Created as a draft and published only after deploy succeeds, so a failed
  # rollout never leaves a visible release naming an image nobody is serving.
  draft: true
  # GitHub does not return drafts when looking a release up by tag, so without
  # this a re-run after a partial failure opens a second draft for the same tag
  # and the signing job can no longer tell which release it is attesting.
  use_existing_draft: true

# release-go installs syft but goreleaser only produces SBOMs when asked.
sboms:
  - id: archives
    artifacts: archive

report_sizes: true

snapshot:
  version_template: "{{.Tag}}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^build:"
      - "^ci:"
      - "^style:"
      - typo
      - readme
