{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - DevTrace</title>
<link rel="icon" href="/static/img/favicon.ico">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/chart.umd.min.js"></script>
</head>
<body>
<nav class="dashboard-nav">
  <div class="nav-left">
    <a href="/dashboard" class="nav-logo">DevTrace</a>
  </div>
  <div class="nav-right">
    <div class="nav-profile">
      <button class="nav-profile-btn">
        <img src="{{.avatar_url}}" alt="" class="nav-avatar" width="28" height="28">
      </button>
      <div class="nav-dropdown">
        <div class="nav-dropdown-header">
          <strong>{{.username}}</strong>
        </div>
        <div class="nav-dropdown-divider"></div>
        <a href="/settings" class="nav-dropdown-item">Settings</a>
        <form action="/auth/signout" method="POST" class="nav-dropdown-form">
          <button type="submit" class="nav-dropdown-item">Sign out</button>
        </form>
      </div>
    </div>
  </div>
</nav>
<main class="dashboard-main">
{{end}}
