{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | DevTrace — Contributor Trust Scoring</title>
<meta name="description" content="Score the trustworthiness of any open source contributor — 23 signals across identity, engagement, community, and behavioral patterns. AI-powered risk narratives.">
<meta name="keywords" content="GitHub contributor reputation, open source contributor trust, detect AI generated pull requests, OSS supply chain trust, contributor license analysis">
<meta property="og:type" content="website">
<meta property="og:title" content="DevTrace | Open Source Contributor Trust & Reputation Scoring">
<meta property="og:description" content="Score any GitHub contributor across 23 trust signals. AI-powered risk narratives. GitHub Action to gate merges on contributor reputation.">
<meta property="og:url" content="https://devtrace.thingz.io">
<meta property="og:image" content="https://devtrace.thingz.io/static/img/favicon.ico">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="DevTrace | Open Source Contributor Trust & Reputation Scoring">
<meta name="twitter:description" content="Score any GitHub contributor across 23 trust signals. AI-powered risk narratives.">
<meta name="twitter:image" content="https://devtrace.thingz.io/static/img/favicon.ico">
<link rel="icon" href="/static/img/favicon.ico">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/chart.umd.min.js"></script>
</head>
<body>
<nav class="dashboard-nav">
  <div class="nav-left">
    <a href="/dashboard" class="nav-logo"><img src="/static/img/logo.svg" alt="" width="24" height="24">DevTrace</a>
  </div>
  <div class="nav-right">
    <div class="nav-profile">
      <button class="nav-profile-btn">
        <img src="{{.avatar_url}}" alt="" class="nav-avatar" width="28" height="28">
      </button>
      <div class="nav-dropdown">
        <div class="nav-dropdown-header">
          <strong>{{.username}}</strong>
        </div>
        <div class="nav-dropdown-divider"></div>
        <a href="/settings" class="nav-dropdown-item">Settings</a>
        <form action="/auth/signout" method="POST" class="nav-dropdown-form">
          <button type="submit" class="nav-dropdown-item">Sign out</button>
        </form>
      </div>
    </div>
  </div>
</nav>
<main class="dashboard-main">
{{end}}
