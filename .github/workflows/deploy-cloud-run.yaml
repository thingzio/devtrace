---
name: deploy-cloud-run

# Thin wrapper over the shared thingzio/actions deploy workflow. All this repo
# contributes is which resource gets which image; the validation, the Artifact
# Registry rewrite and the rollout live there.
#
# https://github.com/thingzio/actions/blob/main/.github/workflows/deploy-cloud-run.md

on:
  workflow_call:
    inputs:
      image_ref:
        description: >-
          Immutable image reference, ghcr.io/<org>/<image>@sha256:<digest>. A
          tag is deliberately not accepted: a tag can move between the build
          and the deploy, and then the thing that was tested is not the thing
          that ships.
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: thingzio/actions/.github/workflows/deploy-cloud-run.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1
    with:
      # Named here rather than read from vars.SERVICE_NAME: a job that calls a
      # reusable workflow cannot see environment-scoped variables, and the
      # service name is not a secret. Naming it makes the deploy readable.
      #
      # Scaling is deliberately not set here. Terraform owns min/max instance
      # count, and `gcloud run services update --image` leaves it alone.
      targets: |
        service=devtrace-saas-serve=${{ inputs.image_ref }}
