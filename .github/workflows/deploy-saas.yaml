name: deploy-saas

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: >-
          Immutable image reference, ghcr.io/<org>/<image>@sha256:<digest>.
          Resolve one with:
          crane digest ghcr.io/thingzio/devtrace-site:<tag>
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-cloud-run.yaml
    with:
      image_ref: ${{ inputs.image_ref }}
    permissions:
      contents: read
      id-token: write
