name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test-on-call.yaml
    permissions:
      contents: read
      id-token: write  # required for Codecov OIDC in unit job

  # Container image is built and published by the shared build definition in
  # thingzio/actions, pinned by SHA. Pinning by SHA rather than tag makes the
  # SLSA provenance builder.id an immutable reference to the exact build
  # definition; verification is unaffected because --signer-workflow carries no
  # ref. See https://github.com/thingzio/actions/blob/main/docs/verification.md
  build:
    needs: test
    uses: thingzio/actions/.github/workflows/build-ko.yaml@8cae31c35ffb538690dfd5ff1b9e4a00b3a265f8  # v1.0.1
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # keyless signing
      attestations: write  # SLSA provenance + SBOM
    with:
      image: thingzio/devtrace-site
      main: ./cmd/devtrace-site
      # Cloud Run is amd64, but arm64 costs nothing here -- ko cross-compiles Go
      # natively, so a multi-platform index comes out of one job with no QEMU.
      # It is what makes `docker run` work for a contributor on Apple Silicon.
      platforms: linux/amd64,linux/arm64

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    permissions:
      contents: write
      id-token: write
    environment: saas
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Load Settings
        shell: bash
        run: |
          set -euo pipefail
          echo "GORELEASER_VERSION=$(yq -r '.build_tools.goreleaser' .settings.yaml)" >> "$GITHUB_ENV"

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools
        with:
          install_goreleaser: 'false'

      # No GCP credential here any more: goreleaser builds binaries and archives,
      # and the container image is published to ghcr.io by the build job above.
      - name: Build Release Artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs:
      - build
      - release
    uses: ./.github/workflows/deploy-cloud-run.yaml
    with:
      # Immutable digest reference, not a tag. Cloud Run pulls it through the
      # Artifact Registry remote repository that fronts ghcr.io.
      image_ref: ${{ needs.build.outputs.image_ref }}
    permissions:
      contents: read
      id-token: write

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build
      - release
      - deploy
    permissions:
      contents: write
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
