name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # required for Codecov OIDC upload
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: thingzio/actions/.github/actions/setup-go@ff1417093cf175d18c6b78266245a7f35fbe995a  # v1.3.0

      - name: Unit Test
        run: make test

      # Skipped for pull requests from forks. GitHub does not issue an OIDC
      # token to fork PRs, so use_oidc would fail and show every external
      # contributor a red check on their first contribution. Coverage for
      # fork PRs is reported when the change lands on main.
      - name: Upload Coverage
        if: github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          flags: unittests
          use_oidc: true
          fail_ci_if_error: false

  # gofmt, go vet and golangci-lint, at the org-pinned linter version.
  lint:
    permissions:
      contents: read
    uses: thingzio/actions/.github/workflows/lint-go.yaml@ff1417093cf175d18c6b78266245a7f35fbe995a  # v1.3.0

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: devtrace_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d devtrace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: thingzio/actions/.github/actions/setup-go@ff1417093cf175d18c6b78266245a7f35fbe995a  # v1.3.0

      - name: Postgres Integration Tests
        env:
          DATABASE_URL: "postgres://test:test@localhost:5432/devtrace_test?sslmode=disable"
        run: go test -v -race -count=1 -timeout=600s ./pkg/data/postgres/...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: devtrace
          POSTGRES_USER: devtrace
          POSTGRES_PASSWORD: devtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devtrace -d devtrace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: thingzio/actions/.github/actions/setup-go@ff1417093cf175d18c6b78266245a7f35fbe995a  # v1.3.0

      - name: E2E Test
        env:
          DATABASE_URL: "postgres://devtrace:devtrace@localhost:5432/devtrace?sslmode=disable"
        run: make e2e
