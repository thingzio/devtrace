name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # required for Codecov OIDC upload
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Unit Test
        run: make test

      # Skipped for pull requests from forks. GitHub does not issue an OIDC
      # token to fork PRs, so use_oidc would fail and show every external
      # contributor a red check on their first contribution. Coverage for
      # fork PRs is reported when the change lands on main.
      - name: Upload Coverage
        if: github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          flags: unittests
          use_oidc: true
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Load Settings
        shell: bash
        run: |
          set -euo pipefail
          echo "GOLANGCI_LINT_VERSION=$(yq -r '.linting.golangci_lint' .settings.yaml)" >> "$GITHUB_ENV"

      - name: Lint Go
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9.2.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: devtrace_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d devtrace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Postgres Integration Tests
        env:
          DATABASE_URL: "postgres://test:test@localhost:5432/devtrace_test?sslmode=disable"
        run: go test -v -race -count=1 -timeout=600s ./pkg/data/postgres/...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: devtrace
          POSTGRES_USER: devtrace
          POSTGRES_PASSWORD: devtrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devtrace -d devtrace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: E2E Test
        env:
          DATABASE_URL: "postgres://devtrace:devtrace@localhost:5432/devtrace?sslmode=disable"
        run: make e2e
