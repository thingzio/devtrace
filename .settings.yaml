# Single source of truth for tool versions and quality thresholds.
# Consumed by Makefile, CI workflows, and .golangci.yaml via yq.

# Language Versions
languages:
  go: '1.27'

# Build Tools
build_tools:
  goreleaser: 'v2.15.4'
  ko: 'v0.18.1'
  tfsec: 'v1.28.14'

# Linting
linting:
  golangci_lint: 'v2.13.1'

# Quality Thresholds
quality:
  # Set from measured coverage (56.5% on 2026-09-11) with ~2 points of slack.
  # Raise it when coverage rises; a gate that fails on a clean checkout is worse
  # than an honest lower number.
  coverage_threshold: '54'
  lint_timeout: '5m'
  test_timeout: '10m'
  build_timeout: '10m0s'
