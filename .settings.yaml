# Single source of truth for tool versions and quality thresholds.
# Consumed by Makefile, CI workflows, and .golangci.yaml via yq.

# Language Versions
languages:
  go: '1.27'

# Build Tools
build_tools:
  goreleaser: 'v2.15.4'
  ko: 'v0.18.1'
  tfsec: 'v1.28.14'

# Linting
linting:
  golangci_lint: 'v2.13.1'

# Quality Thresholds
quality:
  coverage_threshold: '60'
  lint_timeout: '5m'
  test_timeout: '10m'
  build_timeout: '10m0s'
